<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas Personales 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('resumen');

      // 1. ESTADO DE CUENTAS
      const [cuentas, setCuentas] = useState(() => {
        const saved = localStorage.getItem('finanzas_cuentas');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed.map(c => ({
            tipoCuenta: 'Debito',
            limiteCredito: 0,
            tasa: 0,
            historialTasas: c.tasa > 0 ? [{ fechaInicio: '2026-01-01', tasa: c.tasa }] : [],
            ...c
          }));
        }
        return [
          { id: 1, nombre: 'NU', tipoCuenta: 'Debito', saldoInicial: 15000, tasa: 14.50, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 14.50 }] },
          { id: 2, nombre: 'CETES', tipoCuenta: 'Debito', saldoInicial: 25000, tasa: 11.00, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 11.00 }] },
          { id: 3, nombre: 'STORI', tipoCuenta: 'Debito', saldoInicial: 8000, tasa: 15.00, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 15.00 }] },
          { id: 4, nombre: 'PLATA CARD', tipoCuenta: 'Credito', saldoInicial: 2500, tasa: 0, limiteCredito: 25000, historialTasas: [] },
          { id: 5, nombre: 'BBVA CREDITO', tipoCuenta: 'Credito', saldoInicial: 0, tasa: 0, limiteCredito: 45000, historialTasas: [] }
        ];
      });

      // 2. ESTADO DE TRANSACCIONES
      const [transacciones, setTransacciones] = useState(() => {
        const saved = localStorage.getItem('finanzas_transacciones');
        return saved ? JSON.parse(saved) : [];
      });

      const [ultimaCapitalizacion, setUltimaCapitalizacion] = useState(() => {
        return localStorage.getItem('finanzas_ultima_cap') || '2026-11-04';
      });

      // Formularios
      const [monto, setMonto] = useState('');
      const [concepto, setConcepto] = useState('');
      const [tipoMov, setTipoMov] = useState('Egreso');
      const [cuentaSel, setCuentaSel] = useState('');
      const [cuentaDestinoSel, setCuentaDestinoSel] = useState('');
      const [distribucion, setDistribucion] = useState('50% Necesidad');

      const [nuevaCuentaNombre, setNuevaCuentaNombre] = useState('');
      const [nuevaCuentaTipo, setNuevaCuentaTipo] = useState('Debito');
      const [nuevaCuentaSaldo, setNuevaCuentaSaldo] = useState('');
      const [nuevaCuentaTasa, setNuevaCuentaTasa] = useState('');
      const [nuevaCuentaLimite, setNuevaCuentaLimite] = useState('');

      const [cuentaTasaEditId, setCuentaTasaEditId] = useState(null);
      const [nuevaTasaFecha, setNuevaTasaFecha] = useState(new Date().toISOString().split('T')[0]);
      const [nuevaTasaValor, setNuevaTasaValor] = useState('');

      // Persistencia
      useEffect(() => {
        localStorage.setItem('finanzas_cuentas', JSON.stringify(cuentas));
      }, [cuentas]);

      useEffect(() => {
        localStorage.setItem('finanzas_transacciones', JSON.stringify(transacciones));
      }, [transacciones]);

      useEffect(() => {
        localStorage.setItem('finanzas_ultima_cap', ultimaCapitalizacion);
      }, [ultimaCapitalizacion]);

      useEffect(() => {
        if (cuentas.length > 0) {
          if (!cuentaSel) setCuentaSel(cuentas[0].nombre);
          if (!cuentaDestinoSel) setCuentaDestinoSel(cuentas[1]?.nombre || cuentas[0].nombre);
        }
      }, [cuentas]);

      // --- DEPURACIÓN AUTOMÁTICA DE REGISTROS DE RENDIMIENTO DUPLICADOS ---
      useEffect(() => {
        if (transacciones.length === 0) return;

        const vistas = new Set();
        let huboDuplicados = false;

        const transaccionesLimpias = transacciones.filter(t => {
          const esRendimiento = t.concepto && t.concepto.includes('Rendimiento Diario');
          if (esRendimiento) {
            const claveUnica = `${t.cuenta}_${t.fecha}`;
            if (vistas.has(claveUnica)) {
              huboDuplicados = true;
              return false; // Descartar duplicado
            }
            vistas.add(claveUnica);
          }
          return true;
        });

        if (huboDuplicados) {
          setTransacciones(transaccionesLimpias);
        }
      }, []);

      // Auxiliares
      const obtenerTasaVigente = (cuenta, fechaStr) => {
        if (!cuenta.historialTasas || cuenta.historialTasas.length === 0) return cuenta.tasa || 0;
        const ordenadas = [...cuenta.historialTasas].sort((a, b) => new Date(b.fechaInicio) - new Date(a.fechaInicio));
        const vig = ordenadas.find(h => h.fechaInicio <= fechaStr);
        return vig ? vig.tasa : (ordenadas[ordenadas.length - 1]?.tasa || 0);
      };

      const obtenerSaldoCuentaHastaFecha = (nombreCuenta, fechaLimiteStr = null) => {
        const c = cuentas.find(item => item.nombre === nombreCuenta);
        if (!c) return 0;
        
        let movs = transacciones.filter(t => t.cuenta === nombreCuenta);
        if (fechaLimiteStr) {
          movs = movs.filter(t => t.fecha <= fechaLimiteStr);
        }

        const ingresos = movs.filter(t => t.tipo === 'Ingreso').reduce((a, b) => a + b.monto, 0);
        const egresos = movs.filter(t => t.tipo === 'Egreso').reduce((a, b) => a + b.monto, 0);

        if (c.tipoCuenta === 'Credito') {
          return c.saldoInicial + egresos - ingresos;
        } else {
          return c.saldoInicial + ingresos - egresos;
        }
      };

      const obtenerSaldoCuenta = (nombreCuenta) => obtenerSaldoCuentaHastaFecha(nombreCuenta, null);

      // Motor Capitalización 1 vez por día
      const ejecutarCapitalizacionHasta = (fechaObjetivoStr) => {
        const fechaUltima = new Date(ultimaCapitalizacion);
        const fechaTarget = new Date(fechaObjetivoStr);
        const diffDias = Math.floor((fechaTarget - fechaUltima) / (1000 * 60 * 60 * 24));

        let timestamp = Date.now();
        let movsAcumulados = [...transacciones];
        let contAbonos = 0;

        for (let i = 1; i <= (diffDias > 0 ? diffDias : 1); i++) {
          const currDate = new Date(fechaUltima);
          currDate.setDate(currDate.getDate() + (diffDias > 0 ? i : 0));
          const fechaStr = currDate.toISOString().split('T')[0];

          cuentas.filter(c => c.tipoCuenta === 'Debito').forEach(c => {
            const tasaVigente = obtenerTasaVigente(c, fechaStr);
            if (tasaVigente <= 0) return;

            const existe = movsAcumulados.some(t => t.cuenta === c.nombre && t.fecha === fechaStr && t.concepto.includes('Rendimiento Diario'));
            if (existe) return;

            const movsCuenta = movsAcumulados.filter(t => t.cuenta === c.nombre && t.fecha <= fechaStr);
            const ing = movsCuenta.filter(t => t.tipo === 'Ingreso').reduce((a, b) => a + b.monto, 0);
            const egr = movsCuenta.filter(t => t.tipo === 'Egreso').reduce((a, b) => a + b.monto, 0);
            const saldoBase = c.saldoInicial + ing - egr;

            if (saldoBase > 0) {
              const rendimiento = parseFloat((saldoBase * (tasaVigente / 100 / 365)).toFixed(2));
              if (rendimiento > 0) {
                const nuevoMov = {
                  id: timestamp++,
                  fecha: fechaStr,
                  concepto: `Rendimiento Diario (${tasaVigente}%)`,
                  monto: rendimiento,
                  tipo: 'Ingreso',
                  cuenta: c.nombre,
                  distribucion: '20% Ahorro/Inversión'
                };
                movsAcumulados.unshift(nuevoMov);
                contAbonos++;
              }
            }
          });
        }

        if (contAbonos > 0) {
          setTransacciones(movsAcumulados);
          setUltimaCapitalizacion(fechaObjetivoStr);
          return { abonados: contAbonos, mensaje: `¡Se abonaron ${contAbonos} rendimientos correctamente!` };
        }

        setUltimaCapitalizacion(fechaObjetivoStr);
        return { abonados: 0, mensaje: 'Los rendimientos de hoy ya están al día.' };
      };

      useEffect(() => {
        const hoy = new Date().toISOString().split('T')[0];
        ejecutarCapitalizacionHasta(hoy);
      }, []);

      const handleBotonCapitalizar = () => {
        const hoy = new Date().toISOString().split('T')[0];
        const res = ejecutarCapitalizacionHasta(hoy);
        alert(res.mensaje);
      };

      const handleAgregarHistorialTasa = (e) => {
        e.preventDefault();
        const valorNum = parseFloat(nuevaTasaValor);
        if (isNaN(valorNum) || !nuevaTasaFecha || !cuentaTasaEditId) return;

        setCuentas(cuentas.map(c => {
          if (c.id === cuentaTasaEditId) {
            const historialActual = c.historialTasas || [];
            const filtrado = historialActual.filter(h => h.fechaInicio !== nuevaTasaFecha);
            const nuevoHistorial = [...filtrado, { fechaInicio: nuevaTasaFecha, tasa: valorNum }].sort((a, b) => new Date(a.fechaInicio) - new Date(b.fechaInicio));
            return {
              ...c,
              tasa: valorNum,
              historialTasas: nuevoHistorial
            };
          }
          return c;
        }));

        setNuevaTasaValor('');
        setCuentaTasaEditId(null);
        alert('Tasa actualizada correctamente para la fecha seleccionada.');
      };

      // Totales
      const cuentasDebito = cuentas.filter(c => c.tipoCuenta !== 'Credito');
      const cuentasCredito = cuentas.filter(c => c.tipoCuenta === 'Credito');

      const totalSaldoDebito = cuentasDebito.reduce((acc, c) => acc + obtenerSaldoCuenta(c.nombre), 0);
      const totalDeudaCredito = cuentasCredito.reduce((acc, c) => acc + obtenerSaldoCuenta(c.nombre), 0);
      const patrimonioNetoReal = totalSaldoDebito - totalDeudaCredito;

      const totalLimiteCredito = cuentasCredito.reduce((acc, c) => acc + c.limiteCredito, 0);
      const totalDisponibleCredito = totalLimiteCredito - totalDeudaCredito;

      const hoyStr = new Date().toISOString().split('T')[0];
      const rendimientoDiarioTotal = cuentasDebito.reduce((acc, c) => {
        const saldoActual = obtenerSaldoCuenta(c.nombre);
        const tasaHoy = obtenerTasaVigente(c, hoyStr);
        return acc + (saldoActual > 0 ? (saldoActual * (tasaHoy / 100 / 365)) : 0);
      }, 0);

      // ACCIONES
      const handleAgregarMovimiento = (e) => {
        e.preventDefault();
        const numMonto = parseFloat(monto);
        if (!numMonto || isNaN(numMonto)) return;

        const fechaHoy = new Date().toISOString().split('T')[0];

        if (tipoMov === 'Traspaso') {
          if (cuentaSel === cuentaDestinoSel) {
            alert('La cuenta de origen y destino deben ser distintas.');
            return;
          }

          const desc = concepto.trim() ? concepto.trim() : `Traspaso: ${cuentaSel} ➔ ${cuentaDestinoSel}`;

          const movEgreso = {
            id: Date.now(),
            fecha: fechaHoy,
            concepto: desc,
            monto: numMonto,
            tipo: 'Egreso',
            cuenta: cuentaSel,
            distribucion: 'Traspaso entre cuentas'
          };

          const movIngreso = {
            id: Date.now() + 1,
            fecha: fechaHoy,
            concepto: desc,
            monto: numMonto,
            tipo: 'Ingreso',
            cuenta: cuentaDestinoSel,
            distribucion: 'Traspaso entre cuentas'
          };

          setTransacciones([movEgreso, movIngreso, ...transacciones]);
        } else {
          if (!concepto) return;
          const nuevo = {
            id: Date.now(),
            fecha: fechaHoy,
            concepto,
            monto: numMonto,
            tipo: tipoMov,
            cuenta: cuentaSel || cuentas[0]?.nombre,
            distribucion
          };
          setTransacciones([nuevo, ...transacciones]);
        }

        setMonto('');
        setConcepto('');
        setActiveTab('resumen');
      };

      const handleEliminarMovimiento = (id) => {
        if (confirm('¿Deseas eliminar este registro?')) {
          setTransacciones(transacciones.filter(t => t.id !== id));
        }
      };

      const handleAgregarCuenta = (e) => {
        e.preventDefault();
        if (!nuevaCuentaNombre) return;

        const tasaVal = parseFloat(nuevaCuentaTasa) || 0;
        const fechaHoy = new Date().toISOString().split('T')[0];

        const nueva = {
          id: Date.now(),
          nombre: nuevaCuentaNombre.trim(),
          tipoCuenta: nuevaCuentaTipo,
          saldoInicial: parseFloat(nuevaCuentaSaldo) || 0,
          tasa: nuevaCuentaTipo === 'Debito' ? tasaVal : 0,
          limiteCredito: nuevaCuentaTipo === 'Credito' ? (parseFloat(nuevaCuentaLimite) || 0) : 0,
          historialTasas: nuevaCuentaTipo === 'Debito' && tasaVal > 0 ? [{ fechaInicio: fechaHoy, tasa: tasaVal }] : []
        };

        setCuentas([...cuentas, nueva]);
        setNuevaCuentaNombre('');
        setNuevaCuentaSaldo('');
        setNuevaCuentaTasa('');
        setNuevaCuentaLimite('');
      };

      const handleEliminarCuenta = (id) => {
        if (confirm('¿Eliminar esta cuenta?')) {
          setCuentas(cuentas.filter(c => c.id !== id));
        }
      };

      return (
        <div class="max-w-md mx-auto p-4 pb-24">
          {/* Header */}
          <div class="flex justify-between items-center mb-5">
            <div>
              <h1 class="text-xl font-bold text-emerald-400">Finanzas Personales</h1>
              <p class="text-xs text-slate-400">Control de Saldos e Interés Compuesto</p>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">Resumen 2026</span>
            </div>
          </div>

          {/* Menú Superior Navegación */}
          <div class="grid grid-cols-4 gap-1 bg-slate-800 p-1 rounded-xl mb-5 text-center text-xs font-semibold">
            <button onClick={() => setActiveTab('resumen')} class={`py-2 rounded-lg ${activeTab === 'resumen' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Resumen</button>
            <button onClick={() => setActiveTab('captura')} class={`py-2 rounded-lg ${activeTab === 'captura' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>+ Captura</button>
            <button onClick={() => setActiveTab('semanal')} class={`py-2 rounded-lg ${activeTab === 'semanal' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Semanal</button>
            <button onClick={() => setActiveTab('cuentas')} class={`py-2 rounded-lg ${activeTab === 'cuentas' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Cuentas</button>
          </div>

          {/* TAB 1: RESUMEN GENERAL */}
          {activeTab === 'resumen' && (
            <div class="space-y-4">
              {/* Tarjeta de Saldos Totales */}
              <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md space-y-3">
                <div>
                  <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Patrimonio Neto Real (Débito - Deuda)</span>
                  <div class={`text-3xl font-extrabold mt-0.5 ${patrimonioNetoReal >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    ${patrimonioNetoReal.toLocaleString('es-MX', { minimumFractionDigits: 2 })}
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/60 text-xs">
                  <div>
                    <span class="text-slate-400">Dinero en Débito:</span>
                    <div class="text-white font-bold text-sm">${totalSaldoDebito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                  </div>
                  <div>
                    <span class="text-slate-400">Deuda Crédito:</span>
                    <div class="text-rose-400 font-bold text-sm">-${totalDeudaCredito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                  </div>
                </div>

                <div class="pt-2 border-t border-slate-700/60 flex justify-between items-center text-xs">
                  <span class="text-slate-400">Crédito Disponible Total:</span>
                  <span class="text-sky-400 font-bold">${totalDisponibleCredito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</span>
                </div>

                <div class="pt-2 border-t border-slate-700/60 flex justify-between items-center text-xs">
                  <span class="text-slate-400">Rendimiento Estimado/Día:</span>
                  <span class="text-emerald-400 font-bold">+${rendimientoDiarioTotal.toFixed(2)} MXN</span>
                </div>

                <button 
                  onClick={handleBotonCapitalizar}
                  class="w-full mt-2 bg-slate-700 hover:bg-slate-600 border border-emerald-500/30 text-emerald-300 font-bold py-2 rounded-xl text-xs flex justify-center items-center gap-1 transition">
                  ⚡ Capitalizar Rendimientos de Hoy
                </button>
              </div>

              {/* Cuentas de Débito */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3">Cuentas de Débito e Inversión</h2>
                <div class="space-y-2">
                  {cuentasDebito.map(c => {
                    const saldoActual = obtenerSaldoCuenta(c.nombre);
                    const tasaActual = obtenerTasaVigente(c, hoyStr);
                    const rendDia = tasaActual > 0 ? (saldoActual * (tasaActual / 100 / 365)) : 0;
                    return (
                      <div key={c.id} class="flex justify-between items-center text-sm p-2 rounded-lg bg-slate-900/60">
                        <div>
                          <span class="font-semibold text-slate-200">{c.nombre}</span>
                          {tasaActual > 0 && <span class="text-xs text-emerald-400 ml-2">({tasaActual}%)</span>}
                          {rendDia > 0 && <div class="text-[10px] text-slate-400">+${rendDia.toFixed(2)}/día</div>}
                        </div>
                        <span class="font-bold text-white">${saldoActual.toLocaleString('es-MX', {minimumFractionDigits: 2})}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Cuentas de Crédito */}
              {cuentasCredito.length > 0 && (
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                  <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-3">Tarjeta de Crédito</h2>
                  <div class="space-y-3">
                    {cuentasCredito.map(c => {
                      const deudaActual = obtenerSaldoCuenta(c.nombre);
                      const disponible = c.limiteCredito - deudaActual;
                      return (
                        <div key={c.id} class="p-3 rounded-xl bg-slate-900/60 space-y-1.5 border border-slate-800">
                          <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-100">{c.nombre}</span>
                            <span class="text-xs text-slate-400">Límite: ${c.limiteCredito.toLocaleString('es-MX')}</span>
                          </div>
                          <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-800">
                            <div>
                              <span class="text-slate-400">Deuda Actual:</span>
                              <div class="font-bold text-rose-400">-${deudaActual.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                            </div>
                            <div class="text-right">
                              <span class="text-slate-400">Disponible:</span>
                              <div class="font-bold text-sky-400">${disponible.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Movimientos Recientes */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Hoja de Captura (Últimos Movimientos)</h2>
                {transacciones.length === 0 ? (
                  <p class="text-xs text-slate-500 text-center py-4">No hay movimientos registrados.</p>
                ) : (
                  <div class="space-y-2">
                    {transacciones.map(t => (
                      <div key={t.id} class="flex justify-between items-center text-sm p-2.5 rounded-lg bg-slate-900/60 border border-slate-800">
                        <div class="flex-1 pr-2">
                          <div class="font-semibold text-slate-200">{t.concepto}</div>
                          <div class="text-xs text-slate-400">{t.cuenta} • {t.distribucion} • {t.fecha}</div>
                        </div>
                        <div class="flex items-center space-x-3">
                          <span class={`font-bold ${t.tipo === 'Ingreso' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {t.tipo === 'Ingreso' ? '+' : '-'}${t.monto.toLocaleString()}
                          </span>
                          <button onClick={() => handleEliminarMovimiento(t.id)} class="text-slate-500 hover:text-rose-400 text-xs">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: CAPTURA DE GASTO / INGRESO / TRASPASO */}
          {activeTab === 'captura' && (
            <form onSubmit={handleAgregarMovimiento} class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
              <h2 class="text-sm font-bold text-slate-200">Registrar en Hoja de Captura</h2>

              <div>
                <label class="block text-xs text-slate-400 mb-1">Monto ($)</label>
                <input type="number" step="0.01" placeholder="0.00" value={monto} onChange={e => setMonto(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-bold text-emerald-400 focus:outline-none" required />
              </div>

              <div>
                <label class="block text-xs text-slate-400 mb-1">Tipo de Movimiento</label>
                <select value={tipoMov} onChange={e => setTipoMov(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 font-semibold">
                  <option value="Egreso">Egreso (-) [Gasto / Compra]</option>
                  <option value="Ingreso">Ingreso (+) [Entrada / Abono]</option>
                  <option value="Traspaso">Traspaso entre Cuentas (Transferencia)</option>
                </select>
              </div>

              {tipoMov === 'Traspaso' ? (
                <div class="space-y-3 p-3 bg-slate-900/60 rounded-xl border border-slate-700/70">
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs text-rose-400 font-bold mb-1">Cuenta Origen (Sale)</label>
                      <select value={cuentaSel} onChange={e => setCuentaSel(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-200">
                        {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs text-emerald-400 font-bold mb-1">Cuenta Destino (Entra)</label>
                      <select value={cuentaDestinoSel} onChange={e => setCuentaDestinoSel(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-200">
                        {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Concepto Opcional</label>
                    <input type="text" placeholder={`Traspaso: ${cuentaSel} ➔ ${cuentaDestinoSel}`} value={concepto} onChange={e => setConcepto(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                  </div>
                </div>
              ) : (
                <>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Concepto / Descripción</label>
                    <input type="text" placeholder="Ej. Despensa, Gasolina, Supermercado" value={concepto} onChange={e => setConcepto(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none" required />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">Cuenta Destino/Origen</label>
                      <select value={cuentaSel} onChange={e => setCuentaSel(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                        {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">Distribución 50/30/20</label>
                      <select value={distribucion} onChange={e => setDistribucion(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                        <option value="50% Necesidad">50% Necesidad (Fijo)</option>
                        <option value="30% Deseo">30% Deseo (Gusto/Variable)</option>
                        <option value="20% Ahorro/Inversión">20% Ahorro / Inversión</option>
                      </select>
                    </div>
                  </div>
                </>
              )}

              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition mt-2">
                {tipoMov === 'Traspaso' ? 'Ejecutar Traspaso entre Cuentas' : 'Guardar en Captura'}
              </button>
            </form>
          )}

          {/* TAB 3: GASTO SEMANAL */}
          {activeTab === 'semanal' && (
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
              <h2 class="text-sm font-bold text-slate-200">Control de Gasto Semanal</h2>
              <p class="text-xs text-slate-400">Egresos de consumo registrados (excluye traspasos):</p>
              <div class="text-2xl font-bold text-rose-400">
                -${transacciones.filter(t => t.tipo === 'Egreso' && t.distribucion !== 'Traspaso entre cuentas').reduce((a, b) => a + b.monto, 0).toLocaleString('es-MX', {minimumFractionDigits: 2})}
              </div>
              <div class="space-y-2 pt-2">
                {transacciones.filter(t => t.tipo === 'Egreso' && t.distribucion !== 'Traspaso entre cuentas').map(t => (
                  <div key={t.id} class="flex justify-between items-center text-xs p-2 bg-slate-900/50 rounded-lg">
                    <span>{t.concepto} ({t.cuenta})</span>
                    <span class="font-bold text-rose-400">-${t.monto.toLocaleString()}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 4: ADMINISTRACIÓN DE CUENTAS */}
          {activeTab === 'cuentas' && (
            <div class="space-y-4">
              {cuentaTasaEditId && (
                <form onSubmit={handleAgregarHistorialTasa} class="bg-slate-800 p-4 rounded-2xl border border-emerald-500/50 space-y-3">
                  <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-emerald-400 uppercase">Cambiar Tasa con Fecha de Inicio</h3>
                    <button type="button" onClick={() => setCuentaTasaEditId(null)} class="text-slate-400 text-xs">✕ Cancelar</button>
                  </div>
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Fecha de Inicio de Nueva Tasa</label>
                    <input type="date" value={nuevaTasaFecha} onChange={e => setNuevaTasaFecha(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  </div>
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Nueva Tasa Anual (%)</label>
                    <input type="number" step="0.01" placeholder="Ej. 13.00" value={nuevaTasaValor} onChange={e => setNuevaTasaValor(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  </div>
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs">
                    Aplicar Tasa a partir de esta Fecha
                  </button>
                </form>
              )}

              <form onSubmit={handleAgregarCuenta} class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-bold text-emerald-400 uppercase">Agregar Nueva Cuenta</h3>
                
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="Nombre (ej. Plata Card)" value={nuevaCuentaNombre} onChange={e => setNuevaCuentaNombre(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  <select value={nuevaCuentaTipo} onChange={e => setNuevaCuentaTipo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
                    <option value="Debito">Débito / Ahorro</option>
                    <option value="Credito">Tarjeta de Crédito</option>
                  </select>
                </div>

                {nuevaCuentaTipo === 'Debito' ? (
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Saldo Inicial ($)" value={nuevaCuentaSaldo} onChange={e => setNuevaCuentaSaldo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                    <input type="number" step="0.01" placeholder="Tasa Anual (%)" value={nuevaCuentaTasa} onChange={e => setNuevaCuentaTasa(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                  </div>
                ) : (
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Deuda Inicial ($)" value={nuevaCuentaSaldo} onChange={e => setNuevaCuentaSaldo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                    <input type="number" placeholder="Límite de Crédito ($)" value={nuevaCuentaLimite} onChange={e => setNuevaCuentaLimite(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  </div>
                )}

                <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-xs">
                  + Crear Cuenta
                </button>
              </form>

              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Cuentas Registradas</h3>
                {cuentas.map(c => {
                  const tasaActual = obtenerTasaVigente(c, hoyStr);
                  return (
                    <div key={c.id} class="p-3 bg-slate-900/60 rounded-xl space-y-2 border border-slate-800">
                      <div class="flex justify-between items-center text-sm font-bold text-white">
                        <span>{c.nombre} <span class="text-xs font-normal text-slate-400">({c.tipoCuenta})</span></span>
                        <button onClick={() => handleEliminarCuenta(c.id)} class="text-rose-400 text-xs hover:underline">Eliminar</button>
                      </div>

                      {c.tipoCuenta === 'Debito' ? (
                        <div class="space-y-1.5 pt-1 border-t border-slate-800">
                          <div class="flex items-center justify-between text-xs text-slate-400">
                            <span>Tasa Vigente Hoy: <strong class="text-emerald-400">{tasaActual}%</strong></span>
                            <button 
                              onClick={() => { setCuentaTasaEditId(c.id); setNuevaTasaValor(tasaActual); }}
                              class="text-xs text-sky-400 hover:underline font-semibold">
                              + Cambiar Tasa por Fecha
                            </button>
                          </div>
                          
                          {c.historialTasas && c.historialTasas.length > 0 && (
                            <div class="text-[10px] text-slate-500 bg-slate-950/40 p-2 rounded-lg space-y-0.5">
                              <span class="font-bold text-slate-400">Histórico de Tasas:</span>
                              {c.historialTasas.map((h, idx) => (
                                <div key={idx} class="flex justify-between">
                                  <span>Desde {h.fechaInicio}:</span>
                                  <span class="font-bold text-emerald-400">{h.tasa}% APY</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      ) : (
                        <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-800">
                          <span>Límite de Crédito ($):</span>
                          <span class="font-bold text-sky-400">${c.limiteCredito.toLocaleString()}</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
