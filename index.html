<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas Personales 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Obtener fecha local en formato YYYY-MM-DD sin desfase UTC
    const getFechaLocalHoy = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const CATALOGO_CATEGORIAS_DEFAULT = [
      {"categoria": "Renta", "distribucion": "Vivienda"},
      {"categoria": "Hipoteca", "distribucion": "Vivienda"},
      {"categoria": "Gas", "distribucion": "Vivienda"},
      {"categoria": "Luz", "distribucion": "Vivienda"},
      {"categoria": "Gastos de la casa", "distribucion": "Vivienda"},
      {"categoria": "Mascota", "distribucion": "Vivienda"},
      {"categoria": "Mantenimiento", "distribucion": "Vivienda"},
      {"categoria": "Mejora del hogar", "distribucion": "Vivienda"},
      {"categoria": "Despensa y mercado", "distribucion": "Alimentación"},
      {"categoria": "Plan o recarga celular", "distribucion": "Servicios y transporte"},
      {"categoria": "Gasolina auto/moto", "distribucion": "Servicios y transporte"},
      {"categoria": "Transporte público", "distribucion": "Servicios y transporte"},
      {"categoria": "Mantenimiento de auto/moto", "distribucion": "Servicios y transporte"},
      {"categoria": "Estacionamiento", "distribucion": "Servicios y transporte"},
      {"categoria": "Tramites legales", "distribucion": "Servicios y transporte"},
      {"categoria": "Seguro de auto", "distribucion": "Salud y seguros"},
      {"categoria": "Salud (Medicina)", "distribucion": "Salud y seguros"},
      {"categoria": "Eventos (cine, teatro, conciertos)", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Restaurantes / Bares", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Fiestas", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Streaming", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Hotel", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Transporte", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Comidas", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Regalos", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Entretenimiento", "distribucion": "Entretenimiento y ocio"},
      {"categoria": "Higiene personal", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Ropa", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Deporte", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Educacion", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Libros / Útiles / Uniforme", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Juguetes / Juegos", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Bebidas /dulces / pan", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Propinas", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Gasto no reconocido", "distribucion": "Cuidado personal y compras"},
      {"categoria": "Ahorro por meta", "distribucion": "Ahorro e inversión"},
      {"categoria": "Ahorro para el retiro (Afore)", "distribucion": "Ahorro e inversión"},
      {"categoria": "Envíos de dinero", "distribucion": "Pago de deudas"},
      {"categoria": "Préstamo personal", "distribucion": "Pago de deudas"},
      {"categoria": "Nomina", "distribucion": "Negocio/Actividad productiva"},
      {"categoria": "Devoluciones", "distribucion": "Negocio/Actividad productiva"},
      {"categoria": "Intereses", "distribucion": "Negocio/Actividad productiva"},
      {"categoria": "Ganado", "distribucion": "Negocio/Actividad productiva"},
      {"categoria": "Cuadre de Saldos", "distribucion": "Negocio/Actividad productiva"}
    ];

    const DISTRIBUCIONES_LISTA = [
      "Vivienda",
      "Alimentación",
      "Servicios y transporte",
      "Salud y seguros",
      "Entretenimiento y ocio",
      "Cuidado personal y compras",
      "Ahorro e inversión",
      "Pago de deudas",
      "Negocio/Actividad productiva"
    ];

    const DISTRIBUCION_METAS_DEFAULT = {
      "Vivienda": 50,
      "Alimentación": 20,
      "Servicios y transporte": 10,
      "Salud y seguros": 5,
      "Entretenimiento y ocio": 5,
      "Cuidado personal y compras": 5,
      "Ahorro e inversión": 5,
      "Pago de deudas": 0,
      "Negocio/Actividad productiva": 0
    };

    function App() {
      const [activeTab, setActiveTab] = useState('resumen');

      const [ingresoBaseSemanal, setIngresoBaseSemanal] = useState(() => {
        const saved = localStorage.getItem('finanzas_ingreso_base_semanal');
        return saved ? parseFloat(saved) : 10000;
      });

      const [distribucionMetas, setDistribucionMetas] = useState(() => {
        const saved = localStorage.getItem('finanzas_distribucion_metas');
        return saved ? JSON.parse(saved) : DISTRIBUCION_METAS_DEFAULT;
      });

      const [categoriasMap, setCategoriasMap] = useState(() => {
        const saved = localStorage.getItem('finanzas_categorias_map');
        return saved ? JSON.parse(saved) : CATALOGO_CATEGORIAS_DEFAULT;
      });

      const [cuentas, setCuentas] = useState(() => {
        const saved = localStorage.getItem('finanzas_cuentas');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed.map(c => ({
            tipoCuenta: 'Debito',
            limiteCredito: 0,
            tasa: 0,
            historialTasas: c.tasa > 0 ? [{ fechaInicio: '2026-01-01', tasa: c.tasa }] : [],
            ...c
          }));
        }
        return [
          { id: 1, nombre: 'NU', tipoCuenta: 'Debito', saldoInicial: 15000, tasa: 14.50, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 14.50 }] },
          { id: 2, nombre: 'CETES', tipoCuenta: 'Debito', saldoInicial: 25000, tasa: 11.00, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 11.00 }] },
          { id: 3, nombre: 'STORI', tipoCuenta: 'Debito', saldoInicial: 8000, tasa: 15.00, limiteCredito: 0, historialTasas: [{ fechaInicio: '2026-01-01', tasa: 15.00 }] },
          { id: 4, nombre: 'PLATA CARD', tipoCuenta: 'Credito', saldoInicial: 2500, tasa: 0, limiteCredito: 25000, historialTasas: [] },
          { id: 5, nombre: 'BBVA CREDITO', tipoCuenta: 'Credito', saldoInicial: 0, tasa: 0, limiteCredito: 45000, historialTasas: [] }
        ];
      });

      const [transacciones, setTransacciones] = useState(() => {
        const saved = localStorage.getItem('finanzas_transacciones');
        return saved ? JSON.parse(saved) : [];
      });

      const [ultimaCapitalizacion, setUltimaCapitalizacion] = useState(() => {
        return localStorage.getItem('finanzas_ultima_cap') || '2026-11-04';
      });

      const hoyStr = getFechaLocalHoy();
      const [fechaCaptura, setFechaCaptura] = useState(hoyStr);
      const [monto, setMonto] = useState('');
      const [concepto, setConcepto] = useState('');
      const [tipoMov, setTipoMov] = useState('Egreso');
      const [categoriaSel, setCategoriaSel] = useState(CATALOGO_CATEGORIAS_DEFAULT[0].categoria);
      const [cuentaSel, setCuentaSel] = useState('');
      const [cuentaDestinoSel, setCuentaDestinoSel] = useState('');

      const [semanaOffset, setSemanaOffset] = useState(0);
      const [distribucionSeleccionada, setDistribucionSeleccionada] = useState(null);

      const [nuevaCuentaNombre, setNuevaCuentaNombre] = useState('');
      const [nuevaCuentaTipo, setNuevaCuentaTipo] = useState('Debito');
      const [nuevaCuentaSaldo, setNuevaCuentaSaldo] = useState('');
      const [nuevaCuentaTasa, setNuevaCuentaTasa] = useState('');
      const [nuevaCuentaLimite, setNuevaCuentaLimite] = useState('');

      const [nuevaCatNombre, setNuevaCatNombre] = useState('');
      const [nuevaCatDistribucion, setNuevaCatDistribucion] = useState('Alimentación');

      // Persistencia
      useEffect(() => {
        localStorage.setItem('finanzas_ingreso_base_semanal', ingresoBaseSemanal.toString());
      }, [ingresoBaseSemanal]);

      useEffect(() => {
        localStorage.setItem('finanzas_distribucion_metas', JSON.stringify(distribucionMetas));
      }, [distribucionMetas]);

      useEffect(() => {
        localStorage.setItem('finanzas_categorias_map', JSON.stringify(categoriasMap));
      }, [categoriasMap]);

      useEffect(() => {
        localStorage.setItem('finanzas_cuentas', JSON.stringify(cuentas));
      }, [cuentas]);

      useEffect(() => {
        localStorage.setItem('finanzas_transacciones', JSON.stringify(transacciones));
      }, [transacciones]);

      useEffect(() => {
        localStorage.setItem('finanzas_ultima_cap', ultimaCapitalizacion);
      }, [ultimaCapitalizacion]);

      useEffect(() => {
        if (cuentas.length > 0) {
          if (!cuentaSel) setCuentaSel(cuentas[0].nombre);
          if (!cuentaDestinoSel) setCuentaDestinoSel(cuentas[1]?.nombre || cuentas[0].nombre);
        }
      }, [cuentas]);

      const obtenerDistribucionDeCategoria = (nombreCat) => {
        const item = categoriasMap.find(c => c.categoria === nombreCat);
        return item ? item.distribucion : 'General';
      };

      // LIMPIADOR AUTOMÁTICO DE DUPLICADOS Y RENDIMIENTOS DE FECHAS FUTURAS
      useEffect(() => {
        if (transacciones.length === 0) return;
        const hoy = getFechaLocalHoy();
        const vistas = new Set();
        let huboCambios = false;

        const transaccionesLimpias = transacciones.filter(t => {
          // Eliminar cualquier rendimiento generado en fechas futuras
          if (t.concepto && t.concepto.includes('Rendimiento Diario') && t.fecha > hoy) {
            huboCambios = true;
            return false;
          }

          const esRendimiento = t.concepto && t.concepto.includes('Rendimiento Diario');
          if (esRendimiento) {
            const claveUnica = `${t.cuenta}_${t.fecha}`;
            if (vistas.has(claveUnica)) {
              huboCambios = true;
              return false;
            }
            vistas.add(claveUnica);
          }
          return true;
        });

        if (huboCambios) {
          setTransacciones(transaccionesLimpias);
        }
      }, []);

      const obtenerTasaVigente = (cuenta, fechaStr) => {
        if (!cuenta.historialTasas || cuenta.historialTasas.length === 0) return cuenta.tasa || 0;
        const ordenadas = [...cuenta.historialTasas].sort((a, b) => new Date(b.fechaInicio) - new Date(a.fechaInicio));
        const vig = ordenadas.find(h => h.fechaInicio <= fechaStr);
        return vig ? vig.tasa : (ordenadas[ordenadas.length - 1]?.tasa || 0);
      };

      const obtenerSaldoCuenta = (nombreCuenta) => {
        const c = cuentas.find(item => item.nombre === nombreCuenta);
        if (!c) return 0;
        const movs = transacciones.filter(t => t.cuenta === nombreCuenta);
        const ingresos = movs.filter(t => t.tipo === 'Ingreso').reduce((a, b) => a + b.monto, 0);
        const egresos = movs.filter(t => t.tipo === 'Egreso').reduce((a, b) => a + b.monto, 0);

        if (c.tipoCuenta === 'Credito') {
          return c.saldoInicial + egresos - ingresos;
        } else {
          return c.saldoInicial + ingresos - egresos;
        }
      };

      // MOTOR DE CAPITALIZACIÓN DIARIA (CORREGIDO HASTA HOY FECHA LOCAL)
      const ejecutarCapitalizacionHasta = (fechaObjetivoStr) => {
        const hoy = getFechaLocalHoy();
        const targetStr = fechaObjetivoStr > hoy ? hoy : fechaObjetivoStr;

        const parseDate = (s) => {
          const parts = s.split('-');
          return new Date(parts[0], parts[1] - 1, parts[2]);
        };

        const fechaUltima = parseDate(ultimaCapitalizacion);
        const fechaTarget = parseDate(targetStr);
        const diffDias = Math.round((fechaTarget - fechaUltima) / (1000 * 60 * 60 * 24));

        if (diffDias <= 0) {
          setUltimaCapitalizacion(targetStr);
          return { abonados: 0, mensaje: 'Los rendimientos de hoy ya están al día.' };
        }

        let timestamp = Date.now();
        let movsAcumulados = [...transacciones];
        let contAbonos = 0;

        for (let i = 1; i <= diffDias; i++) {
          const currDate = new Date(fechaUltima);
          currDate.setDate(currDate.getDate() + i);

          const year = currDate.getFullYear();
          const month = String(currDate.getMonth() + 1).padStart(2, '0');
          const day = String(currDate.getDate()).padStart(2, '0');
          const fechaStr = `${year}-${month}-${day}`;

          if (fechaStr > hoy) break; // Garantizar no abonar en el futuro

          cuentas.filter(c => c.tipoCuenta === 'Debito').forEach(c => {
            const tasaVigente = obtenerTasaVigente(c, fechaStr);
            if (tasaVigente <= 0) return;

            const existe = movsAcumulados.some(t => t.cuenta === c.nombre && t.fecha === fechaStr && t.concepto.includes('Rendimiento Diario'));
            if (existe) return;

            const movsCuenta = movsAcumulados.filter(t => t.cuenta === c.nombre && t.fecha <= fechaStr);
            const ing = movsCuenta.filter(t => t.tipo === 'Ingreso').reduce((a, b) => a + b.monto, 0);
            const egr = movsCuenta.filter(t => t.tipo === 'Egreso').reduce((a, b) => a + b.monto, 0);
            const saldoBase = c.saldoInicial + ing - egr;

            if (saldoBase > 0) {
              const rendimiento = parseFloat((saldoBase * (tasaVigente / 100 / 365)).toFixed(2));
              if (rendimiento > 0) {
                const nuevoMov = {
                  id: timestamp++,
                  fecha: fechaStr,
                  concepto: `Rendimiento Diario (${tasaVigente}%)`,
                  monto: rendimiento,
                  tipo: 'Ingreso',
                  cuenta: c.nombre,
                  categoria: 'Intereses',
                  distribucion: 'Ahorro e inversión'
                };
                movsAcumulados.push(nuevoMov);
                contAbonos++;
              }
            }
          });
        }

        if (contAbonos > 0) {
          setTransacciones(movsAcumulados);
          setUltimaCapitalizacion(targetStr);
          return { abonados: contAbonos, mensaje: `¡Se abonaron ${contAbonos} rendimientos correctamente!` };
        }

        setUltimaCapitalizacion(targetStr);
        return { abonados: 0, mensaje: 'Los rendimientos de hoy ya están al día.' };
      };

      useEffect(() => {
        ejecutarCapitalizacionHasta(hoyStr);
      }, []);

      const handleBotonCapitalizar = () => {
        const res = ejecutarCapitalizacionHasta(hoyStr);
        alert(res.mensaje);
      };

      // RESPALDO
      const handleExportarDatos = () => {
        const backupData = {
          cuentas,
          transacciones,
          categoriasMap,
          ingresoBaseSemanal,
          distribucionMetas,
          ultimaCapitalizacion,
          fechaRespaldo: new Date().toISOString()
        };
        const jsonStr = JSON.stringify(backupData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Respaldo_Finanzas_${hoyStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportarDatos = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.cuentas && data.transacciones) {
              setCuentas(data.cuentas);
              setTransacciones(data.transacciones);
              if (data.categoriasMap) setCategoriasMap(data.categoriasMap);
              if (data.ingresoBaseSemanal) setIngresoBaseSemanal(data.ingresoBaseSemanal);
              if (data.distribucionMetas) setDistribucionMetas(data.distribucionMetas);
              if (data.ultimaCapitalizacion) setUltimaCapitalizacion(data.ultimaCapitalizacion);
              alert('¡Datos importados con éxito!');
              setActiveTab('resumen');
            } else {
              alert('El archivo no tiene el formato de respaldo correcto.');
            }
          } catch (err) {
            alert('Error al leer el archivo de respaldo.');
          }
        };
        reader.readAsText(file);
      };

      // FECHAS DE VIERNES A JUEVES LOCAL
      const obtenerRangoSemana = (offsetSemanas = 0) => {
        const parts = hoyStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        d.setDate(d.getDate() + (offsetSemanas * 7));
        const day = d.getDay(); // 0: Dom, 1: Lun, 2: Mar, 3: Mié, 4: Jue, 5: Vie, 6: Sáb
        
        const diffViernes = (day >= 5) ? (day - 5) : (day + 2);
        
        const fechaViernes = new Date(d);
        fechaViernes.setDate(d.getDate() - diffViernes);
        
        const fechaJueves = new Date(fechaViernes);
        fechaJueves.setDate(fechaViernes.getDate() + 6);

        const formatLocal = (dt) => {
          const y = dt.getFullYear();
          const m = String(dt.getMonth() + 1).padStart(2, '0');
          const dayStr = String(dt.getDate()).padStart(2, '0');
          return `${y}-${m}-${dayStr}`;
        };

        return { inicio: formatLocal(fechaViernes), fin: formatLocal(fechaJueves) };
      };

      const rangoSemanaActual = obtenerRangoSemana(semanaOffset);

      // ORDENAR SIEMPRE POR FECHA DE EJECUCIÓN DEL MOVIMIENTO (DESCENDENTE)
      const transaccionesOrdenadas = [...transacciones].sort((a, b) => {
        if (b.fecha === a.fecha) {
          return b.id - a.id;
        }
        return b.fecha.localeCompare(a.fecha);
      });

      // Egresos reales de la semana
      const egresosSemana = transaccionesOrdenadas.filter(t => 
        t.tipo === 'Egreso' && 
        t.distribucion !== 'Movimiento' &&
        t.fecha >= rangoSemanaActual.inicio &&
        t.fecha <= rangoSemanaActual.fin
      );

      const totalGastoSemanal = egresosSemana.reduce((acc, t) => acc + t.monto, 0);

      // Agrupación por Distribución
      const distribucionesResumenEgresos = {};
      DISTRIBUCIONES_LISTA.forEach(d => distribucionesResumenEgresos[d] = 0);

      egresosSemana.forEach(t => {
        const distKey = t.distribucion || 'Sin Clasificar';
        distribucionesResumenEgresos[distKey] = (distribucionesResumenEgresos[distKey] || 0) + t.monto;
      });

      const remanenteAhorro = Math.max(0, ingresoBaseSemanal - totalGastoSemanal);

      const listaDistribucionesSemana = DISTRIBUCIONES_LISTA.map(distName => {
        let gastoReal = distribucionesResumenEgresos[distName] || 0;
        
        if (distName === 'Ahorro e inversión') {
          gastoReal += remanenteAhorro;
        }

        const pctReal = ingresoBaseSemanal > 0 ? (gastoReal / ingresoBaseSemanal) * 100 : 0;
        const pctMeta = distribucionMetas[distName] || 0;
        const montoMeta = (ingresoBaseSemanal * pctMeta) / 100;

        return { 
          distribucion: distName, 
          montoReal: gastoReal, 
          pctReal: parseFloat(pctReal.toFixed(1)),
          pctMeta,
          montoMeta,
          superado: gastoReal > montoMeta && montoMeta > 0
        };
      });

      // ACCIONES
      const handleAgregarMovimiento = (e) => {
        e.preventDefault();
        const numMonto = parseFloat(monto);
        if (!numMonto || isNaN(numMonto)) return;

        const fechaFinal = fechaCaptura || hoyStr;

        if (tipoMov === 'Traspaso') {
          if (cuentaSel === cuentaDestinoSel) {
            alert('La cuenta de origen y destino deben ser distintas.');
            return;
          }

          const desc = concepto.trim() ? concepto.trim() : `Traspaso: ${cuentaSel} ➔ ${cuentaDestinoSel}`;

          const movEgreso = {
            id: Date.now(),
            fecha: fechaFinal,
            concepto: desc,
            monto: numMonto,
            tipo: 'Egreso',
            cuenta: cuentaSel,
            categoria: 'Traspaso entre cuentas',
            distribucion: 'Movimiento'
          };

          const movIngreso = {
            id: Date.now() + 1,
            fecha: fechaFinal,
            concepto: desc,
            monto: numMonto,
            tipo: 'Ingreso',
            cuenta: cuentaDestinoSel,
            categoria: 'Traspaso entre cuentas',
            distribucion: 'Movimiento'
          };

          setTransacciones([...transacciones, movEgreso, movIngreso]);
        } else {
          if (!concepto) return;
          const distribucionAsignada = obtenerDistribucionDeCategoria(categoriaSel);

          const nuevo = {
            id: Date.now(),
            fecha: fechaFinal,
            concepto,
            monto: numMonto,
            tipo: tipoMov,
            cuenta: cuentaSel || cuentas[0]?.nombre,
            categoria: categoriaSel,
            distribucion: distribucionAsignada
          };
          setTransacciones([...transacciones, nuevo]);
        }

        setMonto('');
        setConcepto('');
        setActiveTab('resumen');
      };

      const handleEliminarMovimiento = (id) => {
        if (confirm('¿Deseas eliminar este registro?')) {
          setTransacciones(transacciones.filter(t => t.id !== id));
        }
      };

      const handleAgregarCategoriaNueva = (e) => {
        e.preventDefault();
        if (!nuevaCatNombre.trim()) return;
        const nombreLimpio = nuevaCatNombre.trim();
        if (categoriasMap.some(c => c.categoria.toLowerCase() === nombreLimpio.toLowerCase())) {
          alert('Esta categoría ya existe.');
          return;
        }

        const nuevaList = [...categoriasMap, { categoria: nombreLimpio, distribucion: nuevaCatDistribucion }];
        setCategoriasMap(nuevaList);
        setCategoriaSel(nombreLimpio);
        setNuevaCatNombre('');
        alert(`Categoría "${nombreLimpio}" creada vinculada a "${nuevaCatDistribucion}".`);
      };

      const handleAgregarCuenta = (e) => {
        e.preventDefault();
        if (!nuevaCuentaNombre) return;

        const tasaVal = parseFloat(nuevaCuentaTasa) || 0;

        const nueva = {
          id: Date.now(),
          nombre: nuevaCuentaNombre.trim(),
          tipoCuenta: nuevaCuentaTipo,
          saldoInicial: parseFloat(nuevaCuentaSaldo) || 0,
          tasa: nuevaCuentaTipo === 'Debito' ? tasaVal : 0,
          limiteCredito: nuevaCuentaTipo === 'Credito' ? (parseFloat(nuevaCuentaLimite) || 0) : 0,
          historialTasas: nuevaCuentaTipo === 'Debito' && tasaVal > 0 ? [{ fechaInicio: hoyStr, tasa: tasaVal }] : []
        };

        setCuentas([...cuentas, nueva]);
        setNuevaCuentaNombre('');
        setNuevaCuentaSaldo('');
        setNuevaCuentaTasa('');
        setNuevaCuentaLimite('');
      };

      const handleEliminarCuenta = (id) => {
        if (confirm('¿Eliminar esta cuenta?')) {
          setCuentas(cuentas.filter(c => c.id !== id));
        }
      };

      const handleCambiarMetaDistribucion = (distKey, nuevoValor) => {
        const valNum = parseFloat(nuevoValor) || 0;
        setDistribucionMetas({
          ...distribucionMetas,
          [distKey]: valNum
        });
      };

      // Totales
      const cuentasDebito = cuentas.filter(c => c.tipoCuenta !== 'Credito');
      const cuentasCredito = cuentas.filter(c => c.tipoCuenta === 'Credito');

      const totalSaldoDebito = cuentasDebito.reduce((acc, c) => acc + obtenerSaldoCuenta(c.nombre), 0);
      const totalDeudaCredito = cuentasCredito.reduce((acc, c) => acc + obtenerSaldoCuenta(c.nombre), 0);
      const patrimonioNetoReal = totalSaldoDebito - totalDeudaCredito;

      const totalLimiteCredito = cuentasCredito.reduce((acc, c) => acc + c.limiteCredito, 0);
      const totalDisponibleCredito = totalLimiteCredito - totalDeudaCredito;

      const rendimientoDiarioTotal = cuentasDebito.reduce((acc, c) => {
        const saldoActual = obtenerSaldoCuenta(c.nombre);
        const tasaHoy = obtenerTasaVigente(c, hoyStr);
        return acc + (saldoActual > 0 ? (saldoActual * (tasaHoy / 100 / 365)) : 0);
      }, 0);

      // Gastos de la distribución seleccionada para ver su detalle
      const gastosDeDistribucionSel = egresosSemana.filter(t => t.distribucion === distribucionSeleccionada);

      return (
        <div class="max-w-md mx-auto p-4 pb-24">
          {/* Header */}
          <div class="flex justify-between items-center mb-5">
            <div>
              <h1 class="text-xl font-bold text-emerald-400">Finanzas Personales</h1>
              <p class="text-xs text-slate-400">Control de Saldos y Presupuesto Semanal</p>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">Resumen 2026</span>
            </div>
          </div>

          {/* Menú Superior Navegación */}
          <div class="grid grid-cols-4 gap-1 bg-slate-800 p-1 rounded-xl mb-5 text-center text-xs font-semibold">
            <button onClick={() => setActiveTab('resumen')} class={`py-2 rounded-lg ${activeTab === 'resumen' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Resumen</button>
            <button onClick={() => setActiveTab('captura')} class={`py-2 rounded-lg ${activeTab === 'captura' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>+ Captura</button>
            <button onClick={() => setActiveTab('semanal')} class={`py-2 rounded-lg ${activeTab === 'semanal' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Semanal</button>
            <button onClick={() => setActiveTab('cuentas')} class={`py-2 rounded-lg ${activeTab === 'cuentas' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Config</button>
          </div>

          {/* TAB 1: RESUMEN GENERAL */}
          {activeTab === 'resumen' && (
            <div class="space-y-4">
              <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md space-y-3">
                <div>
                  <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Patrimonio Neto Real (Débito - Deuda)</span>
                  <div class={`text-3xl font-extrabold mt-0.5 ${patrimonioNetoReal >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    ${patrimonioNetoReal.toLocaleString('es-MX', { minimumFractionDigits: 2 })}
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/60 text-xs">
                  <div>
                    <span class="text-slate-400">Dinero en Débito:</span>
                    <div class="text-white font-bold text-sm">${totalSaldoDebito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                  </div>
                  <div>
                    <span class="text-slate-400">Deuda Crédito:</span>
                    <div class="text-rose-400 font-bold text-sm">-${totalDeudaCredito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                  </div>
                </div>

                <div class="pt-2 border-t border-slate-700/60 flex justify-between items-center text-xs">
                  <span class="text-slate-400">Crédito Disponible Total:</span>
                  <span class="text-sky-400 font-bold">${totalDisponibleCredito.toLocaleString('es-MX', {minimumFractionDigits: 2})}</span>
                </div>

                <div class="pt-2 border-t border-slate-700/60 flex justify-between items-center text-xs">
                  <span class="text-slate-400">Rendimiento Estimado/Día:</span>
                  <span class="text-emerald-400 font-bold">+${rendimientoDiarioTotal.toFixed(2)} MXN</span>
                </div>

                <button 
                  onClick={handleBotonCapitalizar}
                  class="w-full mt-2 bg-slate-700 hover:bg-slate-600 border border-emerald-500/30 text-emerald-300 font-bold py-2 rounded-xl text-xs flex justify-center items-center gap-1 transition">
                  ⚡ Capitalizar Rendimientos de Hoy
                </button>
              </div>

              {/* Cuentas Débito */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3">Cuentas de Débito e Inversión</h2>
                <div class="space-y-2">
                  {cuentasDebito.map(c => {
                    const saldoActual = obtenerSaldoCuenta(c.nombre);
                    const tasaActual = obtenerTasaVigente(c, hoyStr);
                    const rendDia = tasaActual > 0 ? (saldoActual * (tasaActual / 100 / 365)) : 0;
                    return (
                      <div key={c.id} class="flex justify-between items-center text-sm p-2 rounded-lg bg-slate-900/60">
                        <div>
                          <span class="font-semibold text-slate-200">{c.nombre}</span>
                          {tasaActual > 0 && <span class="text-xs text-emerald-400 ml-2">({tasaActual}%)</span>}
                          {rendDia > 0 && <div class="text-[10px] text-slate-400">+${rendDia.toFixed(2)}/día</div>}
                        </div>
                        <span class="font-bold text-white">${saldoActual.toLocaleString('es-MX', {minimumFractionDigits: 2})}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Cuentas Crédito */}
              {cuentasCredito.length > 0 && (
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                  <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-3">Tarjeta de Crédito</h2>
                  <div class="space-y-3">
                    {cuentasCredito.map(c => {
                      const deudaActual = obtenerSaldoCuenta(c.nombre);
                      const disponible = c.limiteCredito - deudaActual;
                      return (
                        <div key={c.id} class="p-3 rounded-xl bg-slate-900/60 space-y-1.5 border border-slate-800">
                          <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-100">{c.nombre}</span>
                            <span class="text-xs text-slate-400">Límite: ${c.limiteCredito.toLocaleString('es-MX')}</span>
                          </div>
                          <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-800">
                            <div>
                              <span class="text-slate-400">Deuda Actual:</span>

                            </div>
                            <div class="text-right">

                              <div class="font-bold text-sky-400">${disponible.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                            </div>
                          </div>
                        </div>

                  </div>
                </div>

              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">

                {transaccionesOrdenadas.length === 0 ? (

                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

          {/* TAB 2: CAPTURA DE GASTO */}

                  <option value="Ingreso">Ingreso (+) [Entrada / Abono]</option>
                  <option value="Traspaso">Traspaso entre Cuentas (Transferencia)</option>
                </select>
              </div>

              <div>
                <label class="block text-xs text-slate-400 mb-1">Monto ($)</label>
                <input type="number" step="0.01" placeholder="0.00" value={monto} onChange={e => setMonto(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-bold text-emerald-400 focus:outline-none" required />
              </div>

              {tipoMov === 'Traspaso' ? (
                <div class="space-y-3 p-3 bg-slate-900/60 rounded-xl border border-slate-700/70">
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs text-rose-400 font-bold mb-1">Cuenta Origen (Sale)</label>
                      <select value={cuentaSel} onChange={e => setCuentaSel(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-200">
                        {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs text-emerald-400 font-bold mb-1">Cuenta Destino (Entra)</label>
                      <select value={cuentaDestinoSel} onChange={e => setCuentaDestinoSel(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-200">
                        {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Concepto / Referencia Opcional</label>
                    <input type="text" placeholder={`Traspaso: ${cuentaSel} ➔ ${cuentaDestinoSel}`} value={concepto} onChange={e => setConcepto(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                  </div>
                </div>
              ) : (
                <>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Concepto / Descripción</label>
                    <input type="text" placeholder="Ej. Gasolina, Supermercado, Pago servicio" value={concepto} onChange={e => setConcepto(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none" required />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">Categoría</label>
                      <select value={categoriaSel} onChange={e => setCategoriaSel(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2 text-xs text-slate-200">
                        {categoriasMap.map((c, idx) => (
                          <option key={idx} value={c.categoria}>{c.categoria}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">Distribución (Auto)</label>
                      <div class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-emerald-400 truncate">
                        {obtenerDistribucionDeCategoria(categoriaSel)}
                      </div>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Cuenta</label>
                    <select value={cuentaSel} onChange={e => setCuentaSel(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                      {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipoCuenta})</option>)}
                    </select>
                  </div>
                </>
              )}

              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition mt-2">
                {tipoMov === 'Traspaso' ? 'Ejecutar Traspaso entre Cuentas' : 'Guardar Movimiento'}
              </button>
            </form>
          )}

          {/* TAB 3: CONTROL DE GASTO SEMANAL (FILTRADO INTERACTIVO POR DISTRIBUCIÓN) */}
          {activeTab === 'semanal' && (
            <div class="space-y-4">
              {/* Navegador de Semanas */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <div class="flex justify-between items-center">
                  <button 
                    onClick={() => { setSemanaOffset(semanaOffset - 1); setDistribucionSeleccionada(null); }} 
                    class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-200">
                    ◀ Semana Anterior
                  </button>
                  <span class="text-xs font-bold text-emerald-400">
                    {semanaOffset === 0 ? 'Semana En Curso' : `Semana (${semanaOffset})`}
                  </span>
                  <button 
                    onClick={() => { setSemanaOffset(semanaOffset + 1); setDistribucionSeleccionada(null); }} 
                    class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-200"
                    disabled={semanaOffset >= 0}>
                    Siguiente ▶
                  </button>
                </div>

                <div class="text-center pt-1 border-t border-slate-700/60">
                  <span class="text-[11px] text-slate-400">Corte de Nómina (Viernes ➔ Jueves):</span>
                  <div class="text-xs font-bold text-slate-200 mt-0.5">
                    {rangoSemanaActual.inicio} ➔ {rangoSemanaActual.fin}
                  </div>
                </div>

                <div class="pt-2 grid grid-cols-2 gap-2 border-t border-slate-700/60 text-xs">
                  <div>
                    <span class="text-slate-400">Ingreso Base:</span>
                    <div class="text-emerald-400 font-bold">${ingresoBaseSemanal.toLocaleString('es-MX')}</div>
                  </div>
                  <div class="text-right">
                    <span class="text-slate-400">Total Gastado:</span>
                    <div class="text-rose-400 font-bold">-${totalGastoSemanal.toLocaleString('es-MX', {minimumFractionDigits: 2})}</div>
                  </div>
                </div>
              </div>

              {/* Desglose por Distribución con clic para ver lista de gastos */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <div class="flex justify-between items-center">
                  <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                    Distribuciones de Gasto (Toca para ver detalle)
                  </h3>
                  {distribucionSeleccionada && (
                    <button onClick={() => setDistribucionSeleccionada(null)} class="text-[10px] text-sky-400 hover:underline">
                      Ver Todos
                    </button>
                  )}
                </div>

                <div class="space-y-3">
                  {listaDistribucionesSemana.map((d, idx) => {
                    const esSeleccionada = distribucionSeleccionada === d.distribucion;
                    return (
                      <div 
                        key={idx} 
                        onClick={() => setDistribucionSeleccionada(esSeleccionada ? null : d.distribucion)}
                        class={`p-3 rounded-xl space-y-2 border transition cursor-pointer ${esSeleccionada ? 'bg-slate-900 border-emerald-500 shadow-md ring-1 ring-emerald-500' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`}>

                          <div>
                            <span class="font-bold text-slate-200 block">{d.distribucion}</span>

                          <div class="text-right">

                  <button 
                    onClick={handleExportarDatos}
                    class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded-lg text-xs flex justify-center items-center gap-1">
                    📥 Exportar Datos
                  </button>

                  <label class="bg-slate-700 hover:bg-slate-600 text-emerald-400 font-bold py-2 rounded-lg text-xs text-center cursor-pointer flex justify-center items-center">
                    📤 Importar Datos
                    <input type="file" accept=".json" onChange={handleImportarDatos} class="hidden" />
                  </label>
                </div>
              </div>

              {/* Formulario Crear Categoría */}
              <form onSubmit={handleAgregarCategoriaNueva} class="bg-slate-800 p-4 rounded-2xl border border-emerald-500/40 space-y-3">
                <h3 class="text-xs font-bold text-emerald-400 uppercase">+ Crear / Alimentar Nueva Categoría</h3>
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="Nombre Categoría (ej. Mantenimiento)" value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  <select value={nuevaCatDistribucion} onChange={e => setNuevaCatDistribucion(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
                    {DISTRIBUCIONES_LISTA.map((d, i) => <option key={i} value={d}>{d}</option>)}
                  </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs">
                  Guardar Categoría en Base de Datos
                </button>
              </form>

              {/* Crear Cuenta */}
              <form onSubmit={handleAgregarCuenta} class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-bold text-emerald-400 uppercase">Agregar Nueva Cuenta</h3>
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="Nombre (ej. Plata Card)" value={nuevaCuentaNombre} onChange={e => setNuevaCuentaNombre(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  <select value={nuevaCuentaTipo} onChange={e => setNuevaCuentaTipo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
                    <option value="Debito">Débito / Ahorro</option>
                    <option value="Credito">Tarjeta de Crédito</option>
                  </select>
                </div>

                {nuevaCuentaTipo === 'Debito' ? (
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Saldo Inicial ($)" value={nuevaCuentaSaldo} onChange={e => setNuevaCuentaSaldo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                    <input type="number" step="0.01" placeholder="Tasa Anual (%)" value={nuevaCuentaTasa} onChange={e => setNuevaCuentaTasa(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                  </div>
                ) : (
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Deuda Inicial ($)" value={nuevaCuentaSaldo} onChange={e => setNuevaCuentaSaldo(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
                    <input type="number" placeholder="Límite de Crédito ($)" value={nuevaCuentaLimite} onChange={e => setNuevaCuentaLimite(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" required />
                  </div>
                )}

                <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-xs">
                  + Crear Cuenta
                </button>
              </form>

              {/* Lista Cuentas */}
              <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Cuentas Registradas</h3>
                {cuentas.map(c => (
                  <div key={c.id} class="p-3 bg-slate-900/60 rounded-xl space-y-2 border border-slate-800">
                    <div class="flex justify-between items-center text-sm font-bold text-white">
                      <span>{c.nombre} <span class="text-xs font-normal text-slate-400">({c.tipoCuenta})</span></span>
                      <button onClick={() => handleEliminarCuenta(c.id)} class="text-rose-400 text-xs hover:underline">Eliminar</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
